name: Deploy to Docker Hub

on:
  push:
    branches:
      - master
  workflow_dispatch: 
    inputs:
      run_all:
        description: "Run all app?"
        type: choice
        options: [ yes, no ]
        default: yes
      app_name:
        description: "Choice app"
        required: true
        type: choice
        options:
          - app_1
          - app_2
          - app_3

permissions: write-all

jobs:
   all:
     if: ${{ github.event_name == 'push' || inputs.run_all == 'yes' }}

     runs-on: ubuntu-latest
     steps:
       - name: all
         # run: echo "Run all!"
         run: |
            echo "event_name=${{ github.event_name }}"
            echo "run_all=${{ github.event.inputs.run_all }}"
            echo "full_event=${{ toJson(github.event.inputs) }}"

   hello:
     if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_all == 'no' }}

     runs-on: ubuntu-latest
     steps:
       - name: hello
         run: echo "Hello ${{ github.event.inputs.app_name }}"

       
